name: CI-CD

on:
  push:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  ECR_REPO: devops-app
  ECS_CLUSTER: devops-cluster
  ECS_SERVICE: devops-service
  TASK_FAMILY: devops-task

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -v

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - id: login
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image
        env:
          REGISTRY: ${{ steps.login.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$ECR_REPO:$TAG .
          docker push $REGISTRY/$ECR_REPO:$TAG
      - name: Deploy to ECS
        env:
          REGISTRY: ${{ steps.login.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          TD=$(aws ecs describe-task-definition --task-definition $TASK_FAMILY --query taskDefinition)
          NEW=$(echo "$TD" | jq --arg IMG "$REGISTRY/$ECR_REPO:$TAG" \
            '.containerDefinitions[0].image=$IMG | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)')
          aws ecs register-task-definition --cli-input-json "$NEW" > /dev/null
          aws ecs update-service --cluster $ECS_CLUSTER --service $ECS_SERVICE --task-definition $TASK_FAMILY > /dev/null
          aws ecs wait services-stable --cluster $ECS_CLUSTER --services $ECS_SERVICE
